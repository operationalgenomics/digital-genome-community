[package]
name = "gdc-emulators"
version = "1.0.0-alpha"
edition = "2021"
authors = ["Carlos Eduardo Favini"]
description = "GDC Emulators - External to Canon (validation/testing only)"

# CRITICAL: This is NOT part of the GDC Core
# Canon v5.1, line 6491: "GDO, GDE, e quaisquer outras não pertencem ao Canon do GDC"

[dependencies]
digital-genome-community = { path = "../../" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
rand = "0.8"

[lib]
name = "gdc_emulators"
path = "lib.rs"
